spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ${SPRING_APPLICATION_NAME:pine-drink}
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:100MB}
      file-size-threshold: ${MULTIPART_FILE_SIZE_THRESHOLD:2MB}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  session:
    store-type: redis
    timeout: ${SESSION_TIMEOUT:1800s}
    redis:
      flush-mode: on_save
      namespace: ${SESSION_REDIS_NAMESPACE:pine-drink:session}

  rabbitmq:
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 3s
          max-attempts: 3
          multiplier: 2
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/}
    session:
      timeout: ${SERVER_SESSION_TIMEOUT:30m}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.hoandev.pinedrink: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:86400}
    reset-token-expiration: ${JWT_RESET_TOKEN_EXPIRATION:900}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    max-age: ${CORS_MAX_AGE:3600}

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    default:
      limit: ${RATE_LIMIT_DEFAULT_LIMIT:100}
      duration: ${RATE_LIMIT_DEFAULT_DURATION:60}
    endpoints:
      login:
        limit: ${RATE_LIMIT_LOGIN_LIMIT:5}
        duration: ${RATE_LIMIT_LOGIN_DURATION:300}
      register:
        limit: ${RATE_LIMIT_REGISTER_LIMIT:3}
        duration: ${RATE_LIMIT_REGISTER_DURATION:3600}
      refresh-token:
        limit: ${RATE_LIMIT_REFRESH_TOKEN_LIMIT:10}
        duration: ${RATE_LIMIT_REFRESH_TOKEN_DURATION:60}

  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket-name: ${MINIO_BUCKET_NAME:pine-drink-storage}
    public-bucket-name: ${MINIO_PUBLIC_BUCKET_NAME:pine-drink-public}
    private-bucket-name: ${MINIO_PRIVATE_BUCKET_NAME:pine-drink-private}
    presigned-url-expiry: ${MINIO_PRESIGNED_URL_EXPIRY:3600}

  report:
    storage:
      local-dir: ${REPORT_LOCAL_DIR:./storage/reports}
      running-timeout: ${REPORT_RUNNING_TIMEOUT:5m}

  momo:
    partner-code: ${MOMO_PARTNER_CODE:}
    access-key: ${MOMO_ACCESS_KEY:}
    secret-key: ${MOMO_SECRET_KEY:}
    endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
    redirect-url: ${MOMO_REDIRECT_URL:}
    ipn-url: ${MOMO_IPN_URL:}
    request-type: ${MOMO_REQUEST_TYPE:payWithMethod}
    lang: ${MOMO_LANG:vi}
    auto-capture: ${MOMO_AUTO_CAPTURE:true}
    partner-name: ${MOMO_PARTNER_NAME:Pine Drink}
    store-id: ${MOMO_STORE_ID:PineDrinkStore}
    order-group-id: ${MOMO_ORDER_GROUP_ID:}

  email:
    enabled: ${EMAIL_ENABLED:true}
    from: ${EMAIL_FROM:noreply@pine-drink.com}
    from-name: ${EMAIL_FROM_NAME:Pine Drink System}
    max-retry: ${EMAIL_MAX_RETRY:3}
    retry-delay-seconds: ${EMAIL_RETRY_DELAY_SECONDS:60}
    async-by-default: ${EMAIL_ASYNC_BY_DEFAULT:true}
    attachment-path: ${EMAIL_ATTACHMENT_PATH:temp/email-attachments}
    max-attachment-size-mb: ${EMAIL_MAX_ATTACHMENT_SIZE_MB:10}
    log-retention-days: ${EMAIL_LOG_RETENTION_DAYS:90}

  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models/}

  otp:
    ttl-minutes: ${OTP_TTL_MINUTES:10}
    resend-limit-seconds: ${OTP_RESEND_LIMIT_SECONDS:60}
    count-ttl-hours: ${OTP_COUNT_TTL_HOURS:24}
    max-send-per-day: ${OTP_MAX_SEND_PER_DAY:10}

  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}

  outbox:
    poll-interval: ${APP_OUTBOX_POLL_INTERVAL:5000}
    batch-size: ${APP_OUTBOX_BATCH_SIZE:50}
    lock-duration-seconds: ${APP_OUTBOX_LOCK_DURATION_SECONDS:120}
    publish-confirm-timeout-seconds: ${APP_OUTBOX_PUBLISH_CONFIRM_TIMEOUT_SECONDS:5}

  rabbitmq:
    stomp:
      host: ${RABBITMQ_STOMP_HOST:${RABBITMQ_HOST:localhost}}
      port: ${RABBITMQ_STOMP_PORT:61613}
      username: ${RABBITMQ_STOMP_USERNAME:${RABBITMQ_DEFAULT_USER:admin}}
      password: ${RABBITMQ_STOMP_PASSWORD:${RABBITMQ_DEFAULT_PASS:admin123}}
      virtual-host: ${RABBITMQ_STOMP_VHOST:${RABBITMQ_VHOST:/}}
      heartbeat-send-interval: ${RABBITMQ_STOMP_HEARTBEAT_SEND_INTERVAL:10000}
      heartbeat-receive-interval: ${RABBITMQ_STOMP_HEARTBEAT_RECEIVE_INTERVAL:10000}

    realtime:
      exchange: ${APP_RABBITMQ_REALTIME_EXCHANGE:pine.events}
      notification-queue: ${APP_RABBITMQ_REALTIME_NOTIFICATION_QUEUE:pine.notification.queue}
      audit-queue: ${APP_RABBITMQ_REALTIME_AUDIT_QUEUE:pine.audit.queue}
      chat-queue: ${APP_RABBITMQ_REALTIME_CHAT_QUEUE:pine.chat.queue}
      webhook-queue: ${APP_RABBITMQ_REALTIME_WEBHOOK_QUEUE:pine.webhook.queue}
      dlq: ${APP_RABBITMQ_REALTIME_DLQ:pine.events.dlq}
      dlx: ${APP_RABBITMQ_REALTIME_DLX:pine.events.dlx}

    domain-events:
      exchange: ${APP_RABBITMQ_DOMAIN_EVENTS_EXCHANGE:pine-drink.domain-events.exchange}
      queue: ${APP_RABBITMQ_DOMAIN_EVENTS_QUEUE:pine-drink.queue.domain-events.queue}
      retry-queue: ${APP_RABBITMQ_DOMAIN_EVENTS_RETRY_QUEUE:pine-drink.queue.domain-events.retry.queue}
      dlq: ${APP_RABBITMQ_DOMAIN_EVENTS_DLQ:pine-drink.queue.domain-events.dlq}
      routing-key: "${APP_RABBITMQ_DOMAIN_EVENTS_ROUTING_KEY:pine-drink.events.#}"
      retry-routing-key: ${APP_RABBITMQ_DOMAIN_EVENTS_RETRY_ROUTING_KEY:pine-drink.events.retry}
      dlq-routing-key: ${APP_RABBITMQ_DOMAIN_EVENTS_DLQ_ROUTING_KEY:pine-drink.events.failed}
      retry-ttl-ms: ${APP_RABBITMQ_DOMAIN_EVENTS_RETRY_TTL_MS:30000}
      concurrent-consumers: ${APP_RABBITMQ_DOMAIN_EVENTS_CONCURRENT_CONSUMERS:2}
      max-consumers: ${APP_RABBITMQ_DOMAIN_EVENTS_MAX_CONSUMERS:6}
      prefetch: ${APP_RABBITMQ_DOMAIN_EVENTS_PREFETCH:10}

    email:
      exchange: ${APP_RABBITMQ_EMAIL_EXCHANGE:pine-drink.email.exchange}
      queue: ${APP_RABBITMQ_EMAIL_QUEUE:pine-drink.email.queue}
      retry-queue: ${APP_RABBITMQ_EMAIL_RETRY_QUEUE:pine-drink.email.retry.queue}
      dlq: ${APP_RABBITMQ_EMAIL_DLQ:pine-drink.email.dlq}
      routing-key: ${APP_RABBITMQ_EMAIL_ROUTING_KEY:pine-drink.email.send}
      retry-routing-key: ${APP_RABBITMQ_EMAIL_RETRY_ROUTING_KEY:pine-drink.email.retry}
      dlq-routing-key: ${APP_RABBITMQ_EMAIL_DLQ_ROUTING_KEY:pine-drink.email.failed}
      retry-ttl-ms: ${APP_RABBITMQ_EMAIL_RETRY_TTL_MS:30000}
      concurrent-consumers: ${APP_RABBITMQ_EMAIL_CONCURRENT_CONSUMERS:3}
      max-consumers: ${APP_RABBITMQ_EMAIL_MAX_CONSUMERS:10}
      prefetch: ${APP_RABBITMQ_EMAIL_PREFETCH:1}

    background-job:
      exchange: ${APP_RABBITMQ_BACKGROUND_JOB_EXCHANGE:pine-drink.background-job.exchange}
      queue: ${APP_RABBITMQ_BACKGROUND_JOB_QUEUE:pine-drink.background-job.queue}
      retry-queue: ${APP_RABBITMQ_BACKGROUND_JOB_RETRY_QUEUE:pine-drink.background-job.retry.queue}
      dlq: ${APP_RABBITMQ_BACKGROUND_JOB_DLQ:pine-drink.background-job.dlq}
      routing-key: ${APP_RABBITMQ_BACKGROUND_JOB_ROUTING_KEY:pine-drink.background-job.process}
      retry-routing-key: ${APP_RABBITMQ_BACKGROUND_JOB_RETRY_ROUTING_KEY:pine-drink.background-job.retry}
      dlq-routing-key: ${APP_RABBITMQ_BACKGROUND_JOB_DLQ_ROUTING_KEY:pine-drink.background-job.failed}
      retry-ttl-ms: ${APP_RABBITMQ_BACKGROUND_JOB_RETRY_TTL_MS:60000}
      concurrent-consumers: ${APP_RABBITMQ_BACKGROUND_JOB_CONCURRENT_CONSUMERS:2}
      max-consumers: ${APP_RABBITMQ_BACKGROUND_JOB_MAX_CONSUMERS:4}
      prefetch: ${APP_RABBITMQ_BACKGROUND_JOB_PREFETCH:1}

    report:
      exchange: ${APP_RABBITMQ_REPORT_EXCHANGE:pine-drink.report.exchange}
      queue: ${APP_RABBITMQ_REPORT_QUEUE:pine-drink.report.queue}
      retry-queue: ${APP_RABBITMQ_REPORT_RETRY_QUEUE:pine-drink.report.retry.queue}
      dlq: ${APP_RABBITMQ_REPORT_DLQ:pine-drink.report.dlq}
      routing-key: ${APP_RABBITMQ_REPORT_ROUTING_KEY:pine-drink.report.export}
      retry-routing-key: ${APP_RABBITMQ_REPORT_RETRY_ROUTING_KEY:pine-drink.report.retry}
      dlq-routing-key: ${APP_RABBITMQ_REPORT_DLQ_ROUTING_KEY:pine-drink.report.failed}
      retry-ttl-ms: ${APP_RABBITMQ_REPORT_RETRY_TTL_MS:60000}
      concurrent-consumers: ${APP_RABBITMQ_REPORT_CONCURRENT_CONSUMERS:1}
      max-consumers: ${APP_RABBITMQ_REPORT_MAX_CONSUMERS:2}
      prefetch: ${APP_RABBITMQ_REPORT_PREFETCH:1}

    queue:
      geocoding: ${APP_RABBITMQ_QUEUE_GEOCODING:pine-drink.geocoding.queue}

    order-expiry:
      exchange: ${APP_RABBITMQ_ORDER_EXPIRY_EXCHANGE:pine-drink.order-expire.exchange}
      queue: ${APP_RABBITMQ_ORDER_EXPIRY_QUEUE:pine-drink.order-expire.queue}
      routing-key: ${APP_RABBITMQ_ORDER_EXPIRY_ROUTING_KEY:order.expire}

geocoding:
  nominatim:
    base-url: ${GEOCODING_NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
    user-agent: ${GEOCODING_NOMINATIM_USER_AGENT:PineDrinkApp/1.0}
  cache:
    enabled: ${GEOCODING_CACHE_ENABLED:true}
    ttl-days: ${GEOCODING_CACHE_TTL_DAYS:30}

order:
  delivery:
    default-fee: ${ORDER_DELIVERY_DEFAULT_FEE:15000}
    base-fee: ${ORDER_DELIVERY_BASE_FEE:10000}
    fee-per-km: ${ORDER_DELIVERY_FEE_PER_KM:5000}
    max-distance-km: ${ORDER_DELIVERY_MAX_DISTANCE_KM:15}
    road-factor: ${ORDER_DELIVERY_ROAD_FACTOR:1.25}
    free-threshold: ${ORDER_DELIVERY_FREE_THRESHOLD:200000}
  cancel:
    allowed-statuses: ${ORDER_CANCEL_ALLOWED_STATUSES:PENDING,CONFIRMED}
    timeout-minutes: ${ORDER_CANCEL_TIMEOUT_MINUTES:30}
  expire:
    timeout-minutes: ${ORDER_EXPIRE_TIMEOUT_MINUTES:15}
